name: hogwarts-governance
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hogwarts
      POSTGRES_DB: hogwarts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hogwarts -d hogwarts"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://hogwarts:${POSTGRES_PASSWORD}@postgres/hogwarts
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://hogwarts:${POSTGRES_PASSWORD}@postgres/hogwarts
      HUMAN_API_TOKEN: ${HUMAN_API_TOKEN:?Set HUMAN_API_TOKEN}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?Set WORKER_API_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
